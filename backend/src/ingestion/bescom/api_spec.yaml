---

## Fallback Strategy

When BESCOM API is unavailable:

1. **Primary Fallback**: Use cached data (up to 1 hour old)
2. **Secondary Fallback**: Use synthetic data generator
3. **Tertiary Fallback**: Use historical patterns

Confidence levels are automatically adjusted based on data source:

| Source | Confidence |
|--------|------------|
| BESCOM API (live) | HIGH |
| BESCOM API (cached) | MEDIUM |
| Synthetic data | LOW |

---

## Security Considerations

1. **Read-Only Access**: API keys are read-only only
2. **Data Masking**: All PII is masked before transmission
3. **Audit Logging**: All API calls are logged
4. **Rate Limiting**: Prevents abuse and ensures fair usage
5. **TLS Encryption**: All communications are encrypted


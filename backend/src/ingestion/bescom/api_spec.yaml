## Error Codes

| Code | Description |
|------|-------------|
| 200 | Success |
| 400 | Bad Request |
| 401 | Unauthorized |
| 403 | Forbidden (write attempt) |
| 404 | Not Found |
| 429 | Rate Limit Exceeded |
| 500 | Internal Server Error |
| 503 | Service Unavailable |

---

## Rate Limits

| Endpoint | Rate Limit |
|----------|------------|
| `/zones/status` | 60 requests/minute |
| `/feeders/*/load` | 120 requests/minute |
| `/zones/*/transformers` | 60 requests/minute |
| `/zones/connectivity` | 30 requests/minute |
| WebSocket | 10 connections/minute |


### 5. WebSocket Feed

Subscribe to real-time updates via WebSocket.

```http
WS /ws/feed
```

**Connection**:

```javascript
const ws = new WebSocket('wss://api.bescom.internal/v1/ws/feed');

ws.onopen = () => {
  // Subscribe to specific zones
  ws.send(JSON.stringify({
    action: 'subscribe',
    zones: ['Z01', 'Z02', 'Z03']
  }));
};

ws.onmessage = (event) => {
  const data = JSON.parse(event.data);
  // Process real-time updates
  console.log('Update:', data);
};
```

**Message Format**:

```json
{
  "type": "load_update",
  "timestamp": "2026-04-27T14:30:00Z",
  "zone_id": "Z01",
  "feeder_id": "F01-Z01",
  "total_load_kw": 4320.0,
  "ev_load_kw": 880.0,
  "status": "CAUTION"
}
```


# BESCOM Feeder API Specification

## Overview

This specification defines the integration points between UrjaYukti AI and BESCOM's power distribution systems. The API provides real-time grid load data, transformer status, and feeder information for EV charging optimization.

**Important**: This is a decision-support layer. All data is read-only. No write operations to BESCOM systems are permitted.

---

## Base URL

```
https://api.bescom.internal/v1
```

**Note**: In production, this will be BESCOM's internal API. For development, use the mock implementation.

---

## Authentication

All API requests require authentication using API keys.

```http
Authorization: Bearer <api_key>
X-BESCOM-Client-ID: <client_id>
```

---

## Data Masking

All sensitive data must be masked before transmission:

| Data Type | Masking Rule |
|-----------|--------------|
| Consumer IDs | Hash with SHA-256, prefix with `CNS_` |
| Meter Numbers | Last 4 digits only, prefix with `MTR_****` |
| Personal Information | Redacted completely |
| Location Data | Aggregated to zone level, no precise coordinates |

---

## Endpoints

### 1. Get Zone Status

Get current status of all zones including transformer load and headroom.

```http
GET /zones/status
```

**Response**:

```json
{
  "timestamp": "2026-04-27T14:30:00Z",
  "zones": [
    {
      "id": "Z01",
      "name": "Whitefield",
      "transformer_capacity_mw": 50.0,
      "current_load_mw": 42.5,
      "headroom_percent": 15.0,
      "status": "CAUTION",
      "critical_transformers": 2,
      "caution_transformers": 5
    },
    {
      "id": "Z02",
      "name": "HSR Layout",
      "transformer_capacity_mw": 40.0,
      "current_load_mw": 28.0,
      "headroom_percent": 30.0,
      "status": "SAFE",
      "critical_transformers": 0,
      "caution_transformers": 1
    }
  ]
}
```

---

### 2. Get Feeder Load

Get real-time load data for specific feeders.

```http
GET /feeders/{feeder_id}/load
```

**Query Parameters**:

| Parameter | Type | Required | Description |
|-----------|------|----------|-------------|
| start_time | string | No | ISO 8601 timestamp (default: 1 hour ago) |
| end_time | string | No | ISO 8601 timestamp (default: now) |
| resolution | string | No | Time resolution: `1min`, `5min`, `15min`, `1hour` (default: `15min`) |

**Response**:

```json
{
  "feeder_id": "F01-Z01",
  "zone_id": "Z01",
  "name": "Whitefield Main Feeder",
  "capacity_kw": 5000.0,
  "data": [
    {
      "timestamp": "2026-04-27T13:30:00Z",
      "total_load_kw": 4250.0,
      "ev_load_kw": 850.0,
      "non_ev_load_kw": 3400.0,
      "headroom_percent": 15.0,
      "status": "CAUTION"
    },
    {
      "timestamp": "2026-04-27T13:45:00Z",
      "total_load_kw": 4320.0,
      "ev_load_kw": 880.0,
      "non_ev_load_kw": 3440.0,
      "headroom_percent": 13.6,
      "status": "CAUTION"
    }
  ]
}
```

